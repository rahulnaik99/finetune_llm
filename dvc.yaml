# dvc.yaml
# ─────────
# Data Version Control pipeline definition.
# Every data transformation step is tracked so any run is 100% reproducible.
#
# Init:      dvc init
# Run all:   dvc repro
# Push data: dvc push  (requires dvc remote — S3/GCS/local)
# Pull data: dvc pull
# Compare:   dvc metrics diff HEAD~1

stages:

  # ── 1. fetch raw candle data ───────────────────────────────────────────────
  fetch_candles:
    cmd: python scripts/fetch_candles.py --symbols CANBK SBIN HDFCBANK
         --start 2021-01-01 --end 2024-10-10 --out data/candles
    deps:
      - scripts/fetch_candles.py
    outs:
      - data/candles          # Polars Parquet shards, tracked by DVC not git
    params:
      - params.yaml:
        - symbols
        - start_date
        - end_date

  # ── 2. run simulation to generate training data ────────────────────────────
  simulate:
    cmd: python flywheel.py --symbol ${symbol} --start_date ${start_date}
         --rounds ${rounds} --episodes ${episodes_per_round}
         --db data/trading_agent.db
    deps:
      - flywheel.py
      - data_pipeline.py
      - compact_prompt.py
      - trading_agent_sim.ipynb
    outs:
      - data/trading_agent.db
    params:
      - params.yaml:
        - symbol
        - start_date
        - rounds
        - episodes_per_round

  # ── 3. build quality-filtered JSONL dataset ────────────────────────────────
  build_dataset:
    cmd: python data_pipeline.py --db data/trading_agent.db --out data/trading.jsonl
         --min_confidence 0.5 --min_rr 1.3
    deps:
      - data_pipeline.py
      - compact_prompt.py
      - data/trading_agent.db
    outs:
      - data/trading_train.jsonl
      - data/trading_val.jsonl
      - data/trading_test.jsonl
    metrics:
      - data/dataset_stats.json:
          cache: false

  # ── 4. fine-tune ───────────────────────────────────────────────────────────
  finetune:
    cmd: axolotl train axolotl_config.yaml
    deps:
      - axolotl_config.yaml
      - data/trading_train.jsonl
      - data/trading_val.jsonl
    outs:
      - output/nemotron-trading/final_adapter
    metrics:
      - output/nemotron-trading/trainer_state.json:
          cache: false
    params:
      - params.yaml:
        - lora_r
        - num_epochs
        - learning_rate

  # ── 5. evaluate ────────────────────────────────────────────────────────────
  evaluate:
    cmd: python evaluate.py --adapter output/nemotron-trading/final_adapter
         --test data/trading_test.jsonl --out metrics/eval_results.json
    deps:
      - evaluate.py
      - output/nemotron-trading/final_adapter
      - data/trading_test.jsonl
    metrics:
      - metrics/eval_results.json:
          cache: false
